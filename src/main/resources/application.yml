server:
  port: 8080

spring:
  application:
    name: SmartServe AI – Intelligent Local Service Booking Platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartbooking;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driverClassName: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
    repositories:
      enabled: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.smartbooking: INFO
    org.springframework: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger: OFF

jwt:
  secret: mySecretKeyForJWTTokenGenerationAndValidation12345678901234567890
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}

storage:
  mode: ${STORAGE_MODE:local}
  local-base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
  bucket: ${AWS_S3_BUCKET:}
  region: ${AWS_REGION:us-east-1}

app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cache:
    redis-enabled: ${APP_CACHE_REDIS_ENABLED:false}
  messaging:
    rabbit-enabled: ${APP_MESSAGING_RABBIT_ENABLED:false}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}

smartserve:
  ai:
    recommendation:
      weights:
        collaborative: 0.34
        category: 0.18
        rating: 0.20
        popularity: 0.16
        behavior: 0.10
        freshness: 0.02
    fraud:
      flag-threshold: 70
