server:
  port: 8080

spring:
  application:
    name: SmartServe AI - Intelligent Local Service Booking Platform

  datasource:
    url: jdbc:postgresql://ep-restless-breeze-b3oqmnsr-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
    driverClassName: org.postgresql.Driver
    username: neondb_owner
    password: npg_HtKJvxl62Bmp
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
    repositories:
      enabled: false

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    check-template-location: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.smartbooking: DEBUG
    org.springframework: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.springframework.boot.autoconfigure.logging.ConditionEvaluationReportLogger: OFF

jwt:
  secret: SmartServeAI_SecureJWTKey_ChangeInProduction_2024_LocalDev_Key!
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}

storage:
  mode: ${STORAGE_MODE:local}
  local-base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
  bucket: ${AWS_S3_BUCKET:}
  region: ${AWS_REGION:us-east-1}

app:
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,https://*.vercel.app}
  cache:
    redis-enabled: false
  messaging:
    rabbit-enabled: false

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-4o-mini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.0-flash}

smartserve:
  ai:
    recommendation:
      weights:
        collaborative: 0.34
        category: 0.18
        rating: 0.20
        popularity: 0.16
        behavior: 0.10
        freshness: 0.02
    fraud:
      flag-threshold: 70
