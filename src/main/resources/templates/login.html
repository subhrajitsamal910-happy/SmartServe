<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartServe AI Login</title>
    <style>
        body { font-family: Georgia, serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #f8f1df, #d7ece6); color: #18332f; }
        main { width: min(440px, 90vw); background: rgba(255,255,255,.82); border: 1px solid #d8c8a8; border-radius: 24px; padding: 32px; box-shadow: 0 24px 80px rgba(35, 55, 48, .16); }
        label { display: block; margin-top: 18px; font-weight: 700; }
        input { width: 100%; box-sizing: border-box; margin-top: 8px; padding: 13px 14px; border-radius: 12px; border: 1px solid #bba982; }
        button, a { display: inline-block; margin-top: 22px; padding: 12px 16px; border-radius: 999px; background: #1e5a4d; color: white; border: 0; text-decoration: none; font-weight: 700; }
        code { background: #f4ead2; padding: 2px 6px; border-radius: 6px; }
    </style>
</head>
<body>
<main>
    <h1>SmartServe AI</h1>
    <p>Demo login credentials for Swagger or API testing:</p>
    <p><code>user@smartserve.ai / password123</code></p>
    <p><code>admin@smartserve.ai / admin123</code></p>
    <form>
        <label>Email <input value="user@smartserve.ai" aria-label="Email"></label>
        <label>Password <input value="password123" type="password" aria-label="Password"></label>
        <a href="/swagger-ui/index.html">Open Swagger</a>
        <a href="/ui/services">View Services</a>
    </form>
</main>
</body>
</html>
